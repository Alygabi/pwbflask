{% include 'dashboard/cabecalho.html' %}

<!-- Inicio -->
<h1 class="mb-4">Listagem de professores</h1>
<div class="row">


    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>disciplina</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for item in lista %}
            <tr>
                <td>{{item[0]}}</td>
                <td>{{item [1]}}</td>
                <td>{{item[2]}}</td>
                <td>
                    <a href="/professores/{{ item[0] }}/editar" class="btn btn-sm btn-primary">Editar</a>
                    <a href="/professores/{{ item[0] }}/excluir" class="btn btn-sm btn-danger btn-sm" 
                    onclick="return confirm('Tem certeza que deseja excluir este professor?');">Excluir</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
<!-- Inicio -->
 
</div>
