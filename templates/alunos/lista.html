{% include 'dashboard/cabecalho.html' %}

<!-- Inicio -->
<h1 class="mb-4">Lista de Alunos</h1>
<div class="row">


    {% for item in lista_alunos %}
        {{item[1]}}
    {% endfor %}

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for item in lista_alunos %}
            <tr>
                <td>{{ item[0] }}</td>
                <td>{{ item [1] }}</td>
                <td>{{ item[2] }}</td>
                <td>{{ item[3] }}</td>
                <td>
                    <a href="/alunos/{{ item[0] }}/editar" class="btn btn-sm btn-primary">Editar</a>
                    <a href="/alunos/{{ item[0] }}/excluir" class="btn btn-sm btn-danger">Excluir</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
<!-- Inicio -->
 
</div>

{% include 'dashboard/rodape.html' %}
